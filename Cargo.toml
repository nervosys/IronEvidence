[package]
name = "ironevidence"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "Compliance evidence for the IronSecurity stack: OSCAL from each project's control mappings"
repository = "https://github.com/nervosys/IronEvidence"
readme = "README.md"
keywords = ["oscal", "compliance", "nist", "evidence"]
categories = ["cryptography", "command-line-utilities"]
# Not for publication until it reads every project's mappings.
publish = false

[dependencies]
# IronCrypto's dependency-free JSON reader, for its controls export.
ic-json = { version = ">=0.3.1, <0.4" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
