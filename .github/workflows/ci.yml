name: Rust
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --no-default-features
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-first-party-only.py --all-features
      - run: python -m pip install jsonschema
      - run: curl -sfLO https://github.com/usnistgov/OSCAL/releases/download/v1.1.2/oscal_component_schema.json
      - run: cargo run --locked --example component > component.json
        shell: bash
      - run: python scripts/check-oscal-schema.py oscal_component_schema.json component.json
